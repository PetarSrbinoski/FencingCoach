[project]
name = "coachapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-ai[duckduckgo]>=1.89.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501", # line length — not worth reformatting the whole codebase for
]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["E", "I"] # autogenerated

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
# Starting point: catch real bugs (undefined names, obviously wrong types)
# without demanding full annotation coverage on a codebase that wasn't
# typed from day one.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

