[pytest]
# Keep the independent PostgreSQL suite separate from the SQLite backend tests.
testpaths = testing/baseline testing/properties testing/regression testing/integration
pythonpath = backend .
addopts = --strict-markers
markers =
    baseline: independently designed example-based project tests
    property: generated project tests
    regression: tests retained from confirmed counterexamples
    integration: tests using the isolated PostgreSQL application
    live_llm: calls the configured LLM provider; opt in with RUN_LIVE_LLM_EVALS=1
